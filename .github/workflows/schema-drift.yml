name: Schema drift

# Fails the build when src/lib/schema.sql stops describing the live database.
#
# Two connections, so no writable production credential is needed in CI:
#   SCHEMA_SOURCE_URL   read-only role on production. Only pg_catalog is
#                       queried, so a role with no table privileges can read
#                       the full structure without being able to SELECT a row.
#                       Read live, so production cannot silently drift.
#   SCHEMA_SANDBOX_URL  a throwaway Neon branch where schema.sql is built and
#                       rolled back. Holds no production data.

on:
  pull_request:
  push:
    branches: [main]

# A newer run supersedes an in-flight one, so we never hold two database
# connections for the same branch.
concurrency:
  group: schema-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-drift:
    name: schema.sql matches the database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail with a clear, actionable message rather than a confusing
      # connection error when the secrets have not been configured.
      - name: Verify secrets are configured
        env:
          SCHEMA_SOURCE_URL: ${{ secrets.SCHEMA_SOURCE_URL }}
          SCHEMA_SANDBOX_URL: ${{ secrets.SCHEMA_SANDBOX_URL }}
        run: |
          missing=""
          [ -z "$SCHEMA_SOURCE_URL" ] && missing="$missing SCHEMA_SOURCE_URL"
          [ -z "$SCHEMA_SANDBOX_URL" ] && missing="$missing SCHEMA_SANDBOX_URL"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi

      - name: Check schema.sql against the live database
        env:
          SCHEMA_SOURCE_URL: ${{ secrets.SCHEMA_SOURCE_URL }}
          SCHEMA_SANDBOX_URL: ${{ secrets.SCHEMA_SANDBOX_URL }}
        run: node scripts/check-schema-drift.mjs
